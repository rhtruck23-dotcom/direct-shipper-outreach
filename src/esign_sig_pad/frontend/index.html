<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .wrap { padding: 8px; }
      .hint { font-size: 12px; color: #64748b; margin: 0 0 6px; }
      canvas {
        display: block;
        width: 100%;
        height: 140px;
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        touch-action: none;
        cursor: crosshair;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        flex: 1;
        height: 34px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
        background: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary {
        background: #0f766e;
        border-color: #0f766e;
        color: #fff;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .ok { font-size: 12px; color: #047857; margin-top: 6px; min-height: 16px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="hint">Draw your signature, then Apply.</p>
      <canvas id="pad" width="560" height="140"></canvas>
      <div class="row">
        <button type="button" id="clear">Clear</button>
        <button type="button" class="primary" id="apply">Apply signature</button>
      </div>
      <div class="ok" id="status"></div>
    </div>
    <script src="./streamlit-component-lib.js"></script>
    <script>
      (function () {
        const canvas = document.getElementById('pad');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        let drawing = false;
        let dirty = false;

        function resize() {
          const ratio = window.devicePixelRatio || 1;
          const w = canvas.clientWidth;
          const h = canvas.clientHeight;
          canvas.width = Math.floor(w * ratio);
          canvas.height = Math.floor(h * ratio);
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#111827';
          dirty = false;
          status.textContent = '';
        }

        function pos(e) {
          const r = canvas.getBoundingClientRect();
          const src = e.touches ? e.touches[0] : e;
          return { x: src.clientX - r.left, y: src.clientY - r.top };
        }

        function start(e) {
          e.preventDefault();
          drawing = true;
          const p = pos(e);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
        }
        function move(e) {
          if (!drawing) return;
          e.preventDefault();
          const p = pos(e);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
          dirty = true;
        }
        function end(e) {
          if (!drawing) return;
          e.preventDefault();
          drawing = false;
        }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', move);
        canvas.addEventListener('mouseup', end);
        canvas.addEventListener('mouseleave', end);
        canvas.addEventListener('touchstart', start, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', end);

        document.getElementById('clear').onclick = function () {
          resize();
          if (window.Streamlit) {
            window.Streamlit.setComponentValue('');
          }
        };
        document.getElementById('apply').onclick = function () {
          if (!dirty) {
            status.textContent = 'Draw first, then Apply.';
            return;
          }
          const url = canvas.toDataURL('image/png');
          if (window.Streamlit) {
            window.Streamlit.setComponentValue(url);
          }
          status.textContent = 'Signature applied — submit below.';
        };

        resize();
        window.addEventListener('resize', resize);
        if (window.Streamlit) {
          window.Streamlit.setComponentReady();
          window.Streamlit.setFrameHeight(220);
        }
      })();
    </script>
  </body>
</html>
